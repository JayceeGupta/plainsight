<style>
/* Blackout: pure black, white type, grey hierarchy. Colour is reserved for data:
   one colour per machine, the provider glyph, and status dots. */
:root {
  --bg: #000; --raised: #0e0e0e; --pill: #1c1c1c; --line: #1a1a1a; --line2: #262626;
  --text: #f5f5f5; --muted: #8e8e8e; --faint: #5a5a5a;
  --ok: #4ade80; --warn: #f5b041; --bad: #f87171; --claude: #e8794a; --codex: #e5e5e5;
  --font: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --pad: max(16px, env(safe-area-inset-left));
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: #000; color: var(--text); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, label:focus-within { outline: 2px solid #3b82f6; outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .faint { color: var(--faint); }

/* header */
header { position: sticky; top: 0; z-index: 20; background: rgba(0,0,0,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
.bar { max-width: 1320px; margin: 0 auto; padding: 12px 28px; display: flex; align-items: center; gap: 14px; }
.crumbs { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
.brand { font-weight: 600; color: var(--muted); margin-right: 4px; white-space: nowrap; display: inline-flex; align-items: center; gap: 9px; }
.brand svg { width: 24px; height: 24px; flex: none; }
.sep { color: var(--faint); margin: 0 4px; }
.dd { position: relative; }
.dd > button { font-weight: 560; padding: 5px 8px; border-radius: 7px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.dd > button:hover, .dd.open > button { background: var(--pill); }
.dd > button::after { content: ""; width: 7px; height: 7px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg) translateY(-2px); margin-left: 2px; }
.menu { display: none; position: absolute; top: calc(100% + 6px); left: 0; min-width: 250px; max-height: 60vh; overflow: auto; background: #0b0b0b; border: 1px solid var(--line2); border-radius: 12px; padding: 6px; box-shadow: 0 16px 48px rgba(0,0,0,.8); z-index: 30; }
.dd.open .menu { display: block; }
.menu label { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.menu label:hover { background: var(--pill); }
/* no tick boxes: the row itself shows the choice (inputs stay for keyboard and screen readers) */
.menu input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
.menu label { color: var(--muted); margin: 1px 0; }
.menu label:has(input:checked) { background: var(--pill); color: var(--text); font-weight: 560; }
.menu label:has(input:checked)::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--text); margin-left: 12px; flex: none; }
.menu label:has(input:checked):not(:has(.note))::after { margin-left: auto; }
.menu input.msrch { position: static; opacity: 1; width: 100%; height: 34px; margin: 0 0 4px; padding: 0 10px; pointer-events: auto; border: 1px solid var(--line2); border-radius: 8px; background: #050505; color: var(--text); font: inherit; font-size: 14px; outline: none; }
.menu input.msrch:focus { border-color: #3a3a3a; }
.menu input.msrch::placeholder { color: var(--faint); }
.menu label[hidden] { display: none; }
.menu hr { border: 0; border-top: 1px solid var(--line2); margin: 4px 8px; }
.menu .note { color: var(--muted); font-size: 12px; margin-left: auto; padding-left: 12px; }
.tools { display: flex; align-items: center; gap: 10px; }
.seg { display: inline-flex; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 3px; flex: none; }
.seg button { padding: 5px 12px; border-radius: 7px; color: var(--muted); white-space: nowrap; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--pill); color: var(--text); font-weight: 600; }
.seg button:disabled { color: #3a3a3a; cursor: default; }
.seg .segdiv { width: 1px; background: var(--line2); margin: 4px 3px; }
.ib { width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 9px; color: var(--muted); flex: none; }
.ib:hover { background: var(--pill); color: var(--text); }
.ib svg { width: 17px; height: 17px; }
#liveBtn { width: auto; padding: 0 11px; gap: 7px; display: inline-flex; align-items: center; font-weight: 500; }
#liveBtn i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
#liveBtn[aria-pressed="true"] { color: var(--text); }
#liveBtn[aria-pressed="true"] i { background: var(--ok); box-shadow: 0 0 0 3px rgba(74,222,128,.22); animation: p 1.8s infinite; }

/* layout */
main { max-width: 1320px; margin: 0 auto; padding: 8px 28px calc(56px + env(safe-area-inset-bottom)); }
section { margin-top: 40px; }
h2 { font-size: 17px; font-weight: 600; margin: 0 0 14px; letter-spacing: -.005em; }
.head2 { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.head2 h2 { margin: 0; }
.top { display: grid; grid-template-columns: minmax(260px, 380px) 1fr; gap: 48px; margin-top: 28px; }
.hero { font-size: 56px; font-weight: 700; letter-spacing: -.035em; line-height: 1; }
.heroSub { color: var(--muted); margin-top: 10px; }
.subs { margin-top: 30px; display: grid; gap: 22px; }
.srow { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; }
.srow .name { display: flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 560; min-width: 0; }
.srow .name .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .val { font-size: 17px; font-weight: 600; }
.srow .det { grid-column: 1 / -1; color: var(--muted); font-size: 14px; }
.glyph { font-size: 16px; line-height: 1; flex: none; display: inline-flex; vertical-align: -2px; }
.glyph svg { width: 1em; height: 1em; display: block; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 4px; font-size: 13px; color: var(--muted); }
.chips span { display: inline-flex; align-items: center; gap: 6px; }

/* machines list: one row per machine, its live sessions grouped underneath */
.mtab tr.mr td { padding-top: 13px; padding-bottom: 13px; }
.mtab th.r, .mtab td.r { width: 104px; }
.mtab tr.mr.off .n, .mtab tr.mr.off td.v { opacity: .5; }
.mtab tbody.mgroup + tbody.mgroup tr.mr td { border-top: 0; }
/* colour swatch: a plain filled circle, 28px hit area */
/* machine rows: one mark for colour and status, the shared-limit strip, sessions behind a small toggle */
.mtab th:first-child, .mtab td:first-child { width: auto; }
.mn { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
.mn .mlink { font-size: 15.5px; font-weight: 550; }
.mk { position: relative; width: 10px; height: 10px; border-radius: 50%; background: var(--mc); flex: none; transition-property: scale; transition-duration: .12s; }
.mk::before { content: ""; position: absolute; inset: -9px; }
.mk:hover { scale: 1.2; } .mk:active { scale: .96; }
.mk.run { box-shadow: 0 0 0 3px color-mix(in srgb, var(--mc) 35%, transparent); }
.mk.idle { box-shadow: 0 0 0 3px color-mix(in srgb, var(--mc) 20%, transparent); }
.mk.off { background: none; box-shadow: inset 0 0 0 2px var(--mc); }
.mw { font-size: 12.5px; color: var(--faint); }
.mtab tr.can { cursor: pointer; }
.mtab tr.can:hover td { background: #0a0a0a; }
.mtab tr.can:hover .stog:not(.run):not(.idle) { color: var(--text); }
.stog { display: inline-flex; align-items: center; gap: 1px; height: 22px; min-width: 22px; justify-content: center; padding: 0 2px; margin-left: -4px; border-radius: 6px; font-size: 12.5px; color: var(--muted); transition-property: background-color, color; transition-duration: .15s; }
.stog:hover { background: var(--pill); }
.stog:not(.run):not(.idle):hover { color: var(--text); }
.stog:active { scale: .96; }
.stog.run { color: var(--ok); }
.stog.idle { color: var(--warn); }
.mtip .tnote { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line2); color: var(--muted); }
.stl { position: relative; display: block; height: 6px; border-radius: 3px; background: var(--line); }
.stl i { position: absolute; top: 0; bottom: 0; border-radius: 3px; min-width: 4px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pc, var(--mc)) 75%, transparent); background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--pc, var(--mc)) 80%, #000) 0 1.2px, color-mix(in srgb, var(--pc, var(--mc)) 18%, #000) 1.2px 5px); }
.stl u { position: absolute; top: -8px; bottom: -8px; min-width: 6px; z-index: 1; }
.stl u:hover + i { box-shadow: inset 0 0 0 1px var(--pc, var(--mc)); background: repeating-linear-gradient(135deg, var(--pc, var(--mc)) 0 1.2px, color-mix(in srgb, var(--pc, var(--mc)) 30%, #000) 1.2px 5px); }
.stl b { position: absolute; top: -2px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: color-mix(in srgb, var(--pc, var(--mc)) 55%, #000); }
.stl b.on { background: var(--pc, var(--mc)); }
.stl b.on::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--pc, var(--mc)); animation: ping 2.4s cubic-bezier(0, 0, .2, 1) infinite; }
@keyframes ping { 0% { scale: 1; opacity: .5; } 70%, 100% { scale: 2.6; opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .stl b.on::after { animation: none; opacity: 0; } }
.stsc { font-size: 12.5px; color: var(--faint); flex: none; width: 28px; text-align: right; }
.stw { display: flex; align-items: center; gap: 6px; width: 100%; }
.stw .stl { flex: 1; }
.mtip { min-width: 0; }
.mtip .ttl { display: block; max-width: 300px; white-space: normal; line-height: 1.35; }
.mtab .lvm[data-mtip="ses"] { cursor: pointer; }
.mtab .lvm[data-mtip="ses"]:hover span:nth-child(2) { text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 4px; }
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 60; display: flex; align-items: center; gap: 8px; padding: 9px 14px 9px 11px; border-radius: 10px; background: #000; border: 1px solid var(--line2); color: var(--text); font-size: 13.5px; box-shadow: 0 12px 32px rgba(0,0,0,.7); pointer-events: none; opacity: 0; translate: -50% 10px; transition-property: opacity, translate; transition-duration: .2s; transition-timing-function: cubic-bezier(.2, 0, 0, 1); }
.toast.on { opacity: 1; translate: -50% 0; }
.toast svg { width: 15px; height: 15px; color: var(--ok); }
.dd > button { touch-action: pan-y; transition-property: background-color, scale, box-shadow; transition-duration: .15s; }
.dd.drag { position: relative; z-index: 5; }
.dd.drag > button { background: var(--pill); scale: 1.04; box-shadow: 0 10px 28px rgba(0,0,0,.7), 0 0 0 1px var(--line2); cursor: grabbing; }
body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
@media (prefers-reduced-motion: reduce) { .toast { transition-duration: 0s; } }
.stog .chev { display: inline-grid; width: 14px; height: 14px; transition-property: rotate; transition-duration: .15s; transition-timing-function: cubic-bezier(.2, 0, 0, 1); }
.stog .chev svg { width: 14px; height: 14px; }
.stog:not(.run):not(.idle)[aria-expanded="true"] { color: var(--text); }
.stog[aria-expanded="true"] .chev { rotate: 90deg; }
.lvt { font-size: 12.5px; color: var(--muted); }
.stw .lvt { flex: none; min-width: 52px; }
.lvt-s { display: none; }
.ltrack { display: block; height: 4px; border-radius: 2px; background: var(--line2); overflow: hidden; }
.ltrack i { display: block; height: 100%; min-width: 3px; border-radius: 2px; background: var(--mc); }
.mw.run { color: var(--ok); } .mw.idle { color: var(--warn); }
.upd { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; color: var(--text); box-shadow: inset 0 0 0 1.5px var(--text); }
.upd svg { width: 11px; height: 11px; }
.you { font-size: 11.5px; color: var(--faint); box-shadow: inset 0 0 0 1px var(--line2); border-radius: 99px; padding: 0 7px; line-height: 18px; }
.mtab td:first-child, .mtab th:first-child { width: 1%; white-space: nowrap; padding-right: 28px; }
.mtab td:first-child .mn { flex-wrap: nowrap; }
.scell { width: auto; }
.dstrip { display: flex; gap: 3px; width: 100%; height: 10px; border-radius: 5px; }
.dstrip.hatch { background: repeating-linear-gradient(135deg, #1d1d1d 0 2px, #0b0b0b 2px 6px); box-shadow: inset 0 0 0 1px var(--line2); }
.dstrip i { display: block; height: 100%; flex: none; min-width: 3px; border-radius: 5px; background: var(--c); opacity: .35; transition-property: opacity; transition-duration: .12s; }
.dstrip i.me { opacity: 1; }
.dstrip i:not(.me):not(.rest) { opacity: 1; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 58%, transparent) 0 2px, color-mix(in srgb, var(--c) 13%, transparent) 2px 6px); }
.dstrip i:not(.me):not(.rest):hover { background: repeating-linear-gradient(135deg, var(--c) 0 2px, color-mix(in srgb, var(--c) 30%, transparent) 2px 6px); }
.dstrip i.rest { background: none; min-width: 0; }
.dstrip i:hover { opacity: .8; } .dstrip i.me:hover { opacity: 1; }
.mtip { position: fixed; z-index: 50; display: none; pointer-events: none; background: #0b0b0b; border: 1px solid var(--line2); border-radius: 10px; padding: 9px 11px; font-size: 12.5px; min-width: 230px; box-shadow: 0 12px 32px rgba(0,0,0,.8); }
.mtip b { display: block; font-size: 13.5px; margin-bottom: 5px; }
.mtip .r { display: flex; justify-content: space-between; gap: 16px; padding: 1px 0; }
/* status: dot + word, every state aligned the same way */
.stw { display: inline-flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.mst { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.mst.off { color: var(--faint); } .mst.off .sd { background: none; box-shadow: inset 0 0 0 1.5px var(--faint); }
.mst .sd { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--faint); }
.mst.run { color: var(--text); } .mst.run .sd { background: var(--ok); box-shadow: 0 0 0 3px rgba(74,222,128,.18); }
.mst.idle .sd { background: var(--warn); }
.mst.on .sd { background: var(--ok); }
.disc { display: inline-flex; align-items: center; gap: 2px; height: 26px; padding: 0 6px 0 9px; border-radius: 7px; font-size: 13px; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line2); transition-property: background-color, color; transition-duration: .15s; }
.disc:hover { background: var(--pill); color: var(--text); }
.disc:active { scale: .96; }
.disc .chev { display: inline-grid; width: 14px; height: 14px; transition-property: rotate; transition-duration: .15s; transition-timing-function: cubic-bezier(.2, 0, 0, 1); }
.disc .chev svg { width: 14px; height: 14px; }
.disc[aria-expanded="true"] .chev { rotate: 90deg; }
.show-s { display: none; }
/* sortable headers */
th .sortb { display: inline-flex; align-items: center; gap: 5px; color: inherit; font: inherit; }
th .sortb .sa { font-size: 11px; color: var(--faint); opacity: 0; transition-property: opacity; transition-duration: .15s; }
th .sortb:hover, th .sortb.on { color: var(--text); }
th .sortb:hover .sa, th .sortb.on .sa { opacity: 1; }
th.r .sortb { flex-direction: row-reverse; }
/* live session rows */
.mtab tr.lv td { color: var(--muted); font-size: 13.5px; }
.mtab .lvm { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mtab .lvm span:not(.glyph) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mtab .lvm span:nth-child(2) { color: var(--text); }
.mtab .mlink { font-size: 16px; font-weight: 500; }
.mtab .mlink:hover { text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 4px; }
.mtab .sub2 { overflow: hidden; text-overflow: ellipsis; }
.mtab tr.nest td:first-child { padding-left: 30px; }
.mtab tr.nest td:nth-child(2) { padding-left: 8px; }
.pop { position: fixed; z-index: 40; background: #0b0b0b; border: 1px solid var(--line2); border-radius: 14px; padding: 12px; box-shadow: 0 16px 48px rgba(0,0,0,.85); width: 236px; display: none; }
.pop.open { display: block; }
.pop .g { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.pop .g button { width: 28px; height: 28px; border-radius: 50%; background: var(--c); }
.pop .g button[aria-pressed="true"] { box-shadow: 0 0 0 2px #000, 0 0 0 4px #f5f5f5; }
.pop .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--muted); }
.pop input[type=color] { width: 34px; height: 26px; border: 1px solid var(--line2); border-radius: 6px; background: none; padding: 0; cursor: pointer; }
.pop .note { font-size: 12px; color: var(--faint); margin-top: 10px; line-height: 1.4; }
.pop .reset { color: var(--muted); font-size: 13px; }
.pop .reset:hover { color: var(--text); }

/* announcements + live */
/* notices from machines: one quiet line each (what kind, who, the message, until when) */
.anns { display: grid; gap: 6px; margin-top: 18px; }
.ann { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 14px; padding: 9px 14px; border-radius: 10px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; }
.ann .ak { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; }
.ann.heavy .ak { color: var(--warn); }
.ann .ak svg { width: 13px; height: 13px; }
.ann .aw { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.ann .aw b { font-weight: 600; }
.ann .am { min-width: 0; }
.ann .au { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: p 1.6s infinite; flex: none; }
.pulse.idle { background: var(--warn); animation: none; }
@keyframes p { 50% { opacity: .35; } }
.empty { color: var(--muted); padding: 16px; border: 1px dashed var(--line2); border-radius: 14px; font-size: 14px; }

/* chart */
.chartTitle { font-size: 17px; font-weight: 600; margin: 0 0 10px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.chart { position: relative; touch-action: pan-y; }
.chart > svg { width: 100%; height: 300px; display: block; overflow: visible; }
.chart text { fill: var(--faint); font-size: 11px; font-family: var(--font); }
.chart .gl { stroke: var(--line); }
.chart text.lnt { fill: var(--muted); font-size: 10.5px; font-weight: 600; font-variant-numeric: tabular-nums; pointer-events: none; }
.chart text.lnt.w { fill: var(--warn); } .chart text.lnt.b { fill: var(--bad); } .chart text.lnt.z { fill: var(--faint); }
.chart text.lrs { fill: var(--muted); font-size: 10.5px; pointer-events: none; }
.charts { display: grid; gap: 28px; }
.tip { position: absolute; pointer-events: none; background: #0b0b0b; border: 1px solid var(--line2); border-radius: 10px; padding: 9px 11px; font-size: 13px; display: none; min-width: 180px; box-shadow: 0 12px 32px rgba(0,0,0,.8); z-index: 5; }
.tip .r { display: flex; gap: 14px; align-items: center; justify-content: space-between; padding: 1px 0; }
.tip .r span { display: inline-flex; align-items: center; gap: 7px; }
.tip .tot { border-top: 1px solid var(--line2); margin-top: 5px; padding-top: 5px; }

/* stats + types */
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 18px 24px; }

/* breakdown */
table { width: 100%; border-collapse: collapse; }

.nm { display: inline-flex; flex-direction: column; gap: 7px; max-width: 100%; }

/* machines */

/* dialog */
dialog { background: #050505; color: var(--text); border: 1px solid var(--line2); border-radius: 18px; padding: 26px 30px 28px; width: min(980px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); box-shadow: 0 24px 80px rgba(0,0,0,.9); }

.dstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin: 26px 0 30px; }
.dstats .v { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
.dtypes { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }

/* subscriptions list (limits + machine split) */
.led { margin-top: 26px; border-top: 1px solid var(--line); }

.led.one .lrow { padding-top: 0; border-bottom: 0; }

.lrow .top .who .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .top button.who:hover .l { text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 4px; }
.lrow .top .val { margin-left: auto; font-size: 17px; font-weight: 650; white-space: nowrap; }
.lrow .det { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 13px; margin-top: -8px; }
/* a limit: one caption line (what is left, when it resets) over one bar, in the subscription's
   colour. The solid part is what is left. The rest was used: hatched, by default in the colour of
   the machine that used it, so the bar is never blank. The white line is an even pace. */
.lims { display: grid; gap: 16px; }
.lim { display: grid; gap: 7px; --lc: var(--text); }
.lim .k { display: flex; align-items: baseline; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.lim .w { min-width: 38px; color: var(--text); font-size: 13px; font-weight: 600; white-space: nowrap; }

.lim.bad b { color: var(--bad); }

.lbt { position: relative; display: flex; gap: 2px; height: 16px; min-width: 0; }

.lbt .lfill { background: var(--lc); }
/* every hatch on the page is the same: its colour at one strength for the lines, one for the gaps */
.lbt .lu { --c: var(--lc); background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 58%, transparent) 0 2px, color-mix(in srgb, var(--c) 13%, transparent) 2px 6px); }
.lbt .lgap { background: repeating-linear-gradient(135deg, var(--warn) 0 2px, color-mix(in srgb, var(--warn) 24%, transparent) 2px 6px); }
.lbt .lpace { position: absolute; top: -3px; bottom: -3px; height: auto; width: 2px; min-width: 0; margin-left: -1px; border-radius: 1px; background: var(--text); box-shadow: 0 0 0 2px #000; }
/* a limit inside a limit (one model's own share of the week): right under its parent, as wide, thinner */
.lim.part { margin-top: -8px; gap: 5px; }
.lim.part .w { min-width: 0; margin-right: 4px; color: var(--muted); font-weight: 500; }
.lim.part b { font-size: 13px; font-weight: 600; }
.lim.part .lbt { height: 8px; }
/* several subscriptions in view: the same bars at the same width, a little closer together */
.lims.cmp { gap: 13px; }
/* a reset saved for later */
.lbank { display: inline-flex; align-items: center; flex: none; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 12px; font-weight: 550; color: var(--text); white-space: nowrap; box-shadow: inset 0 0 0 1px var(--line2); cursor: default; }
.mtip .sect { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line2); }
.mtip .sect .r > span:first-child { display: inline-flex; align-items: center; gap: 7px; }
.mtip .tnote.wrap { max-width: 270px; white-space: normal; line-height: 1.4; }
/* the bar again inside its card, with the white line named and any overspend marked in amber */
.mtip .pg { margin: 9px 0 8px; }
.mtip .pg .lbt { height: 10px; }
.mtip .pgl { position: relative; height: 15px; margin-top: 6px; font-size: 11.5px; color: var(--muted); }
.mtip .pgl span { position: absolute; top: 0; white-space: nowrap; }
/* limit freshness: one quiet line (when the numbers were read, by which machine) that opens the recent checks */
.lfw { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: -6px; min-width: 0; }
.lfw > .lbank:first-child { margin-left: auto; }
.lfresh { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 2px 6px; max-width: 100%; min-width: 0; padding: 3px 0; font-size: 12.5px; color: var(--faint); text-align: left; transition-property: color; transition-duration: .15s; }
.lfresh:hover, .lfresh[aria-expanded="true"] { color: var(--muted); }

.lfresh .lfa.bad { color: var(--bad); }
.lfresh .lfa svg { width: 13px; height: 13px; flex: none; }
.lfresh .lfa .more { color: var(--muted); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lfresh .lf { display: inline-flex; align-items: center; gap: 7px; min-width: 0; white-space: nowrap; }
.lfresh .lf .stale { color: var(--warn); }
.lfresh .lf .lby { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.lfresh .lf .lby span:last-child { overflow: hidden; text-overflow: ellipsis; }
.lfresh .lf .dot { width: 6px; height: 6px; }

.lpop { position: absolute; z-index: 15; top: calc(100% + 6px); left: 0; width: min(380px, 100%); background: #0b0b0b; border: 1px solid var(--line2); border-radius: 12px; padding: 14px 14px 11px; box-shadow: 0 16px 48px rgba(0,0,0,.85); font-size: 13px; scroll-margin: 12px; }
.lpop:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }
/* one lane per machine on a shared time line that ends now: a mark per check in the machine's colour,

.lks { display: grid; grid-template-columns: fit-content(42%) minmax(0, 1fr); gap: 6px 12px; align-items: center; }
.lks.solo { grid-template-columns: minmax(0, 1fr); }
.lks .who { display: inline-flex; align-items: center; gap: 7px; min-width: 0; color: var(--muted); font-size: 12.5px; }
.lks .who span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lks .who .dot { width: 6px; height: 6px; }
.ltl { position: relative; height: 20px; padding: 0 5px; }
.ltl::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line2); }
.ltl > span { display: block; position: relative; height: 100%; pointer-events: none; }
.ltl i { position: absolute; top: 5px; bottom: 5px; width: 3px; margin-left: -1.5px; border-radius: 1.5px; background: var(--c); box-shadow: 0 0 0 2px #0b0b0b; transition-property: top, bottom; transition-duration: .1s; }
.ltl i.f { top: 6px; bottom: 6px; width: 8px; margin-left: -4px; border-radius: 50%; background: #0b0b0b; box-shadow: inset 0 0 0 2px var(--c), 0 0 0 2px #0b0b0b; }
.ltl i.sel { top: 0; bottom: 0; z-index: 1; }
.ltl i.f.sel { top: 5px; bottom: 5px; width: 10px; margin-left: -5px; }
.lax { grid-column: -2 / -1; display: flex; justify-content: space-between; margin-top: -3px; color: var(--faint); font-size: 11.5px; }
.lro { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 12px; margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line2); color: var(--muted); }
.lro .t { color: var(--faint); }
.lro .v b { margin-left: 5px; color: var(--text); font-weight: 600; }
.lro .lwarn { color: var(--warn); } .lro .lbad { color: var(--bad); }
.meter .k { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.meter .k b { color: var(--text); font-weight: 600; }
.meter .mtrack { height: 8px; border-radius: 4px; background: var(--line2); margin-top: 6px; overflow: hidden; }
.meter .mtrack i { display: block; height: 100%; border-radius: 4px; background: var(--text); }
.meter.hot .mtrack i { background: var(--warn); } .meter.hot .k b { color: var(--warn); }
/* the period's usage by machine: one bar, then who each part is */
.msplit .sb { display: flex; gap: 2px; height: 12px; }
.msplit .sb button { height: 100%; border-radius: 4px; min-width: 4px; background: var(--mc); transition: opacity .15s; }
.msplit .sb:hover button:not(:hover) { opacity: .45; }

.msplit .sl button:hover { color: var(--text); }
.msplit .sl .n { overflow: hidden; text-overflow: ellipsis; }
.msplit .sl b { font-weight: 600; color: var(--text); }
.msplit .sl .dot { width: 6px; height: 6px; }

/* chart head, legend, options */
.chartHead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.chartHead .chartTitle { margin: 0; margin-right: auto; }
.charts { align-content: start; }
.cleg { align-items: flex-start; display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 8px; }
.cleg button { display: inline-flex; align-items: center; gap: 7px; padding: 3px 9px; border-radius: 99px; font-size: 13px; color: var(--muted); transition: opacity .15s; }
.cleg button:hover { background: var(--pill); color: var(--text); }
.cleg button[aria-pressed="false"] { opacity: .4; text-decoration: line-through; text-decoration-color: var(--faint); }
.cleg .static { display: inline-flex; align-items: center; gap: 7px; padding: 3px 9px; font-size: 13px; color: var(--faint); }
.cpop { width: 330px; }
.cpop .srow3 .l { display: flex; align-items: center; gap: 7px; }
.cpop .nick { width: 100%; min-width: 0; padding: 2px 0; background: none; border: 0; border-bottom: 1px solid transparent; color: var(--text); font: inherit; outline: none; text-overflow: ellipsis; }
.cpop .nick:hover { border-bottom-color: var(--line2); }
.cpop .nick:focus { border-bottom-color: #4a4a4a; }
.cpop h4 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.cpop .opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 8px; }
.cpop .seg button { padding: 3px 9px; font-size: 12.5px; }
.cpop .srow3 { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; padding: 6px 0; border-top: 1px solid var(--line2); }
.cpop .srow3 .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cpop .dashes { display: inline-flex; gap: 2px; }
.cpop .dashes button { width: 30px; height: 22px; border-radius: 6px; display: grid; place-items: center; }
.cpop .dashes button[aria-pressed="true"] { background: var(--pill); }
.cpop input[type=color] { width: 22px; height: 22px; border: 0; border-radius: 50%; padding: 0; background: none; cursor: pointer; }
.cpop input[type=color]::-webkit-color-swatch-wrapper { padding: 0; } .cpop input[type=color]::-webkit-color-swatch { border: 1px solid var(--line2); border-radius: 50%; }

.bdtools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.chip { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 9px; border-radius: 7px; font-size: 13.5px; color: var(--muted); transition-property: background-color, color, opacity; transition-duration: .15s; }
.chip:hover { background: var(--pill); color: var(--text); }

.chip.ghost:hover { color: var(--text); }
.chips2 .dd > button { font-weight: 400; padding: 0 9px; }

tr.click { cursor: pointer; }

.dchart { margin: 4px 0 18px; }
.dhint { font-size: 12.5px; color: var(--faint); margin: 0 0 6px; }
.dm { display: grid; }
.dfind { width: 100%; height: 34px; margin: 0 0 8px; padding: 0 10px; border: 1px solid var(--line2); border-radius: 8px; background: #050505; color: var(--text); font: inherit; font-size: 14px; outline: none; }

.dmore { justify-self: start; margin-top: 6px; height: 28px; padding: 0 9px; border-radius: 7px; font-size: 13.5px; color: var(--faint); transition-property: background-color, color; transition-duration: .15s; }
.dmore:hover { background: var(--pill); color: var(--text); }
.dm button { display: grid; grid-template-columns: minmax(0, 1fr) 90px 64px 74px; gap: 4px 12px; align-items: center; padding: 9px 8px; border-top: 1px solid var(--line); border-radius: 8px; text-align: left; transition: opacity .15s, background .15s; font-size: 14px; }
.dm button:hover { background: #0c0c0c; }

.dm button .who { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.dm button .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dm button .dbar { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--mc); }
.dm button[aria-pressed="true"] .who span { color: var(--text); font-weight: 600; }
.dm button.ex { opacity: .32; }
.dm button.ex .who span { text-decoration: line-through; text-decoration-color: var(--faint); }
.dm.hi button[aria-pressed="false"]:not(.ex) { opacity: .4; }

footer { margin-top: 48px; color: var(--faint); font-size: 13px; line-height: 1.6; }

.err { color: var(--bad); margin-top: 16px; }

/* header wraps before the filters and the period switch collide */
@media (max-width: 1300px) {

}

const glyph = (p) => GLYPH[p] || '<span class="glyph faint">•</span>';
const PROV = (p) => p === 'claude' ? 'Claude Code' : p === 'codex' ? 'Codex' : p;
const ls = { get(k, d) { try { const v = localStorage.getItem('ps:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('ps:' + k, JSON.stringify(v)); } catch {} } };
const CHART0 = { res: 'hour', mode: 'comb', type: 'lines', lanes: true, limc: 'mach', fill: true, curve: 'smooth', styles: {}, hidden: [] };
const S = { range: ls.get('range', '24h'), metric: ls.get('metric', 'cost'), bd: ['time', 'machine'].includes(ls.get('bd', 'model')) ? ls.get('bd') : 'model', merge: ls.get('merge', 'split') === 'merge' ? 'merge' : 'split', chart: { ...CHART0, ...ls.get('chart', {}) }, subs: ls.get('subs', []), machines: ls.get('machines', []), providers: ls.get('providers', []), live: ls.get('live', true) };
let data = null, es = null;
S.nicks = ls.get('nicks', {}); // subscription -> your own name for it, on this device

const fmtC = (n) => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const val = (t) => S.metric === 'cost' ? t.cost : t.tokens;
const fmtV = (n) => S.metric === 'cost' ? fmtC(n) : fmtN(n);
const dur = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`; };
const ago = (ms) => ms < 60e3 ? 'just now' : ms < 3600e3 ? Math.round(ms / 60e3) + 'm ago' : ms < 864e5 ? Math.round(ms / 3600e3) + 'h ago' : Math.round(ms / 864e5) + 'd ago';
// colour: this device's override > shared choice (set from a machine running plainsight) > palette

function seg(id, key, onChange) {

function dropdown(id, key, items, allLabel, noun, btnText) {
  const dd = $(id), btn = dd.querySelector('button'), menu = dd.querySelector('.menu');
  const sel = new Set(S[key].filter((v) => items.some((i) => i.v === v)));
  btn.textContent = btnText || (!sel.size ? allLabel : sel.size === 1 ? items.find((i) => sel.has(i.v)).label : `${sel.size} ${noun}`);
  const old = menu.querySelector('.msrch'), q = old ? old.value : '', typing = old && document.activeElement === old;
  menu.innerHTML = (items.length > 8 ? `<input class="msrch" type="search" placeholder="Find ${esc(noun.replace(/s$/, ''))}" aria-label="Find ${esc(noun)}">` : '') +
    `<label><input type="checkbox" data-all ${sel.size ? '' : 'checked'}> ${esc(allLabel)}</label><hr>` +
    items.map((i) => `<label><input type="checkbox" value="${esc(i.v)}" ${sel.has(i.v) ? 'checked' : ''}> ${i.html || esc(i.label)}${i.note ? `<span class="note">${esc(i.note)}</span>` : ''}</label>`).join('');
  const find = menu.querySelector('.msrch');
  if (find) {

    find.value = q; filter(); find.oninput = filter;

    if (e.target === find) return;
    if (e.target.dataset.all !== undefined) S[key] = [];

function closeMenus() { document.querySelectorAll('.dd').forEach((d) => { d.classList.remove('open'); d.querySelector('button').setAttribute('aria-expanded', 'false'); }); }
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.dd > button');
  if (btn) { const dd = btn.parentElement, open = !dd.classList.contains('open'); closeMenus(); dd.classList.toggle('open', open); btn.setAttribute('aria-expanded', String(open)); if (open && matchMedia('(pointer: fine)').matches) dd.querySelector('.msrch')?.focus(); if (open && matchMedia('(max-width:640px)').matches) dd.querySelector('.menu').style.top = btn.getBoundingClientRect().bottom + 'px'; return; }

// Header filters can be dragged into any order (kept per browser). Alt+Left/Right moves the focused one.
(() => {
  const nav = document.querySelector('.crumbs'), ids = ['dd-subs', 'dd-machines', 'dd-providers'];
  const place = (order) => { const seps = [...nav.querySelectorAll(':scope > .sep')]; order.forEach((id, i) => seps[i].after($(id))); };
  const cur = () => [...nav.querySelectorAll(':scope > .dd')].map((d) => d.id);
  const ease = { duration: 220, easing: 'cubic-bezier(.2, 0, 0, 1)' };
  const tx = (el) => parseFloat(el.style.translate) || 0;
  // move others smoothly from where they were to where they now are
  const flip = (order, skip) => {
    const was = new Map(ids.map((id) => [id, $(id).getBoundingClientRect().left]));
    place(order);
    for (const id of ids) {
      if (id === skip) continue;
      const dx = was.get(id) - $(id).getBoundingClientRect().left;
      if (dx) $(id).animate([{ translate: `${dx}px 0` }, { translate: '0 0' }], ease);
    }
  };
  const saved = ls.get('ddorder', ids);
  if (saved.length === 3 && ids.every((i) => saved.includes(i))) place(saved);
  let drag = null, swallow = false;
  nav.addEventListener('pointerdown', (e) => {
    const btn = e.target.closest('.dd > button');
    if (!btn || e.button !== 0) return;
    drag = { dd: btn.parentElement, x0: e.clientX, grab: e.clientX - btn.parentElement.getBoundingClientRect().left, on: false, id: e.pointerId };
  });
  addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const el = drag.dd;
    if (!drag.on) {
      if (Math.abs(e.clientX - drag.x0) < 6) return;
      drag.on = true; closeMenus(); el.classList.add('drag'); document.body.classList.add('dragging');
    }
    const follow = () => { const base = el.getBoundingClientRect().left - tx(el); el.style.translate = `${e.clientX - drag.grab - base}px 0`; };
    follow();
    const order = cur(), i = order.indexOf(el.id);
    const mid = (id) => { const r = $(id).getBoundingClientRect(); return r.left + r.width / 2; };
    const j = i > 0 && e.clientX < mid(order[i - 1]) ? i - 1 : i < order.length - 1 && e.clientX > mid(order[i + 1]) ? i + 1 : i;
    if (j !== i) { order.splice(i, 1); order.splice(j, 0, el.id); flip(order, el.id); follow(); }
  });

// Answers are kept per query so switching filters back and forth is instant; new data clears them.
const qcache = new Map();
function query(machines = S.machines) {
  const p = new URLSearchParams({ range: S.range, tz: String(new Date().getTimezoneOffset()), res: S.chart.res });
  if (S.subs.length) p.set('subs', S.subs.join(','));

// a subscription can go by a name of your own; the plan's name stays in .plan

}
async function fetchSummary(q) {
  const r = await fetch('/api/summary?' + q, { cache: 'no-store' });

  applyNicks(d);

}

  const q = query(), seq = ++loadSeq;

    if (seq !== loadSeq) return; // a newer click won
    $('err').textContent = '';

  } catch (e) { if (!hit) $('err').textContent = 'Could not load data: ' + e.message; }

function prefetch() {
  clearTimeout(prefetchT);

      const set = new Set(S.machines); set.has(m) ? set.delete(m) : set.add(m);
      const q = query([...set]);
      if (!qcache.has(q)) { try { await fetchSummary(q); } catch { return; } }
    }
  }, 300);
}

function render() {
  const o = data.options;
  dropdown('dd-subs', 'subs', o.subscriptions.map((s) => ({ v: s.sub, label: s.label, html: `${glyph(s.provider)}${esc(s.label)}`, note: PROV(s.provider) })), 'All subscriptions', 'subscriptions');

  dropdown('dd-machines', 'machines', (o.machineOrder || o.machines).map((m) => ({ v: m, label: m, html: `${mdot(m)}${esc(m)}`, note: online.has(m) ? 'online' : '' })), 'All machines', 'machines');
  dropdown('dd-providers', 'providers', o.providers.map((p) => ({ v: p, label: PROV(p), html: `${glyph(p)}${esc(PROV(p))}` })), 'All providers', 'providers');

  const limOk = Object.keys(data.limits || {}).length === 1 && data.subscriptions.length <= 1;
  $('range').querySelectorAll('button').forEach((b) => {
    if (b.dataset.v === 'win' || b.dataset.v === 'week') { b.disabled = !limOk && data.range !== b.dataset.v; b.title = b.disabled ? 'Needs one subscription in view with limit data' : b.dataset.v === 'win' ? 'Since the current 5-hour window started' : 'Since the weekly limit last reset'; }

const boltIco = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 2 4.5 13.5h6L9.5 22l9.5-12h-6.2z"/></svg>';

function pretty(id) {

const SORT = ls.get('sort', {});

document.addEventListener('click', (e) => {

function renderMachines() {

  const best = (n) => useOf(n)[0] || { totals: { cost: 0, tokens: 0 }, sub: null };

    other: (m) => (S.metric === 'cost' ? best(m.nick).totals.tokens : best(m.nick).totals.cost),
  }, (x, y) => (y.nick === viewer) - (x.nick === viewer) || (live[y.nick] ? now : y.lastSeen) - (live[x.nick] ? now : x.lastSeen)));
  const order = ms.map((m) => m.nick);
