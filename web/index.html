<style>
/* Blackout: pure black, white type, grey hierarchy. Colour is reserved for data:
   one colour per machine, the provider glyph, and status dots. */
:root {
  --bg: #000; --raised: #0e0e0e; --pill: #1c1c1c; --line: #1a1a1a; --line2: #262626;
  --text: #f5f5f5; --muted: #8e8e8e; --faint: #5a5a5a;
  --ok: #4ade80; --warn: #f5b041; --bad: #f87171; --claude: #e8794a; --codex: #e5e5e5;
  --font: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --pad: max(16px, env(safe-area-inset-left));
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: #000; color: var(--text); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, label:focus-within { outline: 2px solid #3b82f6; outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .faint { color: var(--faint); }

/* header */
header { position: sticky; top: 0; z-index: 20; background: rgba(0,0,0,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
.bar { max-width: 1320px; margin: 0 auto; padding: 12px 28px; display: flex; align-items: center; gap: 14px; }
.crumbs { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
.brand { font-weight: 600; color: var(--muted); margin-right: 4px; white-space: nowrap; display: inline-flex; align-items: center; gap: 9px; }
.brand svg { width: 24px; height: 24px; flex: none; }
.sep { color: var(--faint); margin: 0 4px; }
.dd { position: relative; }
.dd > button { font-weight: 560; padding: 5px 8px; border-radius: 7px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.dd > button:hover, .dd.open > button { background: var(--pill); }
.dd > button::after { content: ""; width: 7px; height: 7px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg) translateY(-2px); margin-left: 2px; }
.menu { display: none; position: absolute; top: calc(100% + 6px); left: 0; min-width: 250px; max-height: 60vh; overflow: auto; background: #0b0b0b; border: 1px solid var(--line2); border-radius: 12px; padding: 6px; box-shadow: 0 16px 48px rgba(0,0,0,.8); z-index: 30; }
.dd.open .menu { display: block; }
.menu label { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.menu label:hover { background: var(--pill); }
/* no tick boxes: the row itself shows the choice (inputs stay for keyboard and screen readers) */
.menu input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
.menu label { color: var(--muted); margin: 1px 0; }
.menu label:has(input:checked) { background: var(--pill); color: var(--text); font-weight: 560; }
.menu label:has(input:checked)::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--text); margin-left: 12px; flex: none; }
.menu label:has(input:checked):not(:has(.note))::after { margin-left: auto; }
.menu hr { border: 0; border-top: 1px solid var(--line2); margin: 4px 8px; }
.menu .note { color: var(--muted); font-size: 12px; margin-left: auto; padding-left: 12px; }
.tools { display: flex; align-items: center; gap: 10px; }
.seg { display: inline-flex; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 3px; flex: none; }
.seg button { padding: 5px 12px; border-radius: 7px; color: var(--muted); white-space: nowrap; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--pill); color: var(--text); font-weight: 600; }
.seg button:disabled { color: #3a3a3a; cursor: default; }
.seg .segdiv { width: 1px; background: var(--line2); margin: 4px 3px; }
.ib { width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 9px; color: var(--muted); flex: none; }
.ib:hover { background: var(--pill); color: var(--text); }
.ib svg { width: 17px; height: 17px; }
#liveBtn { width: auto; padding: 0 11px; gap: 7px; display: inline-flex; align-items: center; font-weight: 500; }
#liveBtn i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
#liveBtn[aria-pressed="true"] { color: var(--text); }
#liveBtn[aria-pressed="true"] i { background: var(--ok); box-shadow: 0 0 0 3px rgba(74,222,128,.22); animation: p 1.8s infinite; }

/* layout */
main { max-width: 1320px; margin: 0 auto; padding: 8px 28px calc(56px + env(safe-area-inset-bottom)); }
section { margin-top: 40px; }
h2 { font-size: 17px; font-weight: 600; margin: 0 0 14px; letter-spacing: -.005em; }
.head2 { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.head2 h2 { margin: 0; }
.top { display: grid; grid-template-columns: minmax(260px, 380px) 1fr; gap: 48px; margin-top: 28px; }
.hero { font-size: 56px; font-weight: 700; letter-spacing: -.035em; line-height: 1; }
.heroSub { color: var(--muted); margin-top: 10px; }
.subs { margin-top: 30px; display: grid; gap: 22px; }
.srow { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; }
.srow .name { display: flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 560; min-width: 0; }
.srow .name .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .val { font-size: 17px; font-weight: 600; }
.srow .det { grid-column: 1 / -1; color: var(--muted); font-size: 14px; }
.glyph { font-size: 16px; line-height: 1; flex: none; display: inline-flex; vertical-align: -2px; }
.glyph svg { width: 1em; height: 1em; display: block; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 4px; font-size: 13px; color: var(--muted); }
.chips span { display: inline-flex; align-items: center; gap: 6px; }

/* machines list: one row per machine, its live sessions grouped underneath */
.mlist { border-top: 1px solid var(--line); }
.mrow { border-bottom: 1px solid var(--line); padding: 16px 0; }
.mrow.off { opacity: .55; }
.mhead { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; }
.sw-btn { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; }
.sw-btn i { width: 10px; height: 10px; border-radius: 50%; background: var(--mc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--mc) 22%, transparent); transition: transform .12s; }
.sw-btn:hover i { transform: scale(1.25); }
.mname { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex-wrap: wrap; }
.mname b { font-size: 16px; font-weight: 600; }
.mstate { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.mstate.act { color: var(--ok); }
.mmeta { grid-column: 2; font-size: 12.5px; color: var(--faint); margin-top: -2px; }
.mval { text-align: right; white-space: nowrap; }
.mval b { font-size: 16px; font-weight: 600; display: block; }
.mval span { font-size: 12.5px; color: var(--muted); }
.mbar { grid-column: 2 / -1; height: 2px; border-radius: 1px; background: var(--line); margin-top: 8px; overflow: hidden; }
.mbar i { display: block; height: 100%; background: var(--mc); border-radius: 1px; }
.sess { margin: 12px 0 0 36px; display: grid; gap: 0; border-left: 1px solid var(--line2); }
.srow2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 2px 16px; align-items: center; padding: 7px 0 7px 14px; font-size: 13.5px; color: var(--muted); position: relative; }
.srow2::before { content: ""; position: absolute; left: -4px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px #000; }
.srow2.idle::before { background: var(--warn); }
.srow2 .m { color: var(--text); display: inline-flex; align-items: center; gap: 7px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow2 b { color: var(--text); font-weight: 600; }
.srow2 .r { text-align: right; white-space: nowrap; }
.pop { position: fixed; z-index: 40; background: #0b0b0b; border: 1px solid var(--line2); border-radius: 14px; padding: 12px; box-shadow: 0 16px 48px rgba(0,0,0,.85); width: 236px; display: none; }
.pop.open { display: block; }
.pop .g { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.pop .g button { width: 28px; height: 28px; border-radius: 50%; background: var(--c); }
.pop .g button[aria-pressed="true"] { box-shadow: 0 0 0 2px #000, 0 0 0 4px #f5f5f5; }
.pop .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--muted); }
.pop input[type=color] { width: 34px; height: 26px; border: 1px solid var(--line2); border-radius: 6px; background: none; padding: 0; cursor: pointer; }
.pop .note { font-size: 12px; color: var(--faint); margin-top: 10px; line-height: 1.4; }
.pop .reset { color: var(--muted); font-size: 13px; }
.pop .reset:hover { color: var(--text); }

/* announcements + live */
.anns { display: grid; gap: 8px; margin-top: 18px; }
.ann { border: 1px solid rgba(245,176,65,.35); background: rgba(245,176,65,.06); border-radius: 12px; padding: 11px 14px; display: flex; gap: 6px 12px; flex-wrap: wrap; align-items: baseline; }
.ann b.k { color: var(--warn); font-weight: 600; }
.live { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); background: var(--raised); border-radius: 14px; padding: 14px 16px; position: relative; overflow: hidden; }
.card.mc::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--mc); }
.lc .t { display: flex; align-items: center; gap: 8px; font-weight: 600; flex-wrap: wrap; }
.lc .meta { color: var(--muted); font-size: 13.5px; margin-top: 8px; display: grid; gap: 3px; }
.lc .meta b { color: var(--text); font-weight: 600; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: p 1.6s infinite; flex: none; }
.pulse.idle { background: var(--warn); animation: none; }
@keyframes p { 50% { opacity: .35; } }
.empty { color: var(--muted); padding: 16px; border: 1px dashed var(--line2); border-radius: 14px; font-size: 14px; }

/* chart */
.chartTitle { font-size: 17px; font-weight: 600; margin: 0 0 10px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.chart { position: relative; touch-action: pan-y; }
.chart svg { width: 100%; height: 300px; display: block; overflow: visible; }
.chart text { fill: var(--faint); font-size: 11px; font-family: var(--font); }
.chart .gl { stroke: var(--line); }
.charts { display: grid; gap: 28px; }
.tip { position: absolute; pointer-events: none; background: #0b0b0b; border: 1px solid var(--line2); border-radius: 10px; padding: 9px 11px; font-size: 13px; display: none; min-width: 180px; box-shadow: 0 12px 32px rgba(0,0,0,.8); z-index: 5; }
.tip .r { display: flex; gap: 14px; align-items: center; justify-content: space-between; padding: 1px 0; }
.tip .r span { display: inline-flex; align-items: center; gap: 7px; }
.tip .tot { border-top: 1px solid var(--line2); margin-top: 5px; padding-top: 5px; }

/* stats + types */
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 18px 24px; }
.stat .k { color: var(--muted); font-size: 14px; }
.stat .v { font-size: 24px; font-weight: 600; letter-spacing: -.01em; margin-top: 2px; }
.subhead { display: flex; align-items: center; gap: 8px; font-weight: 560; margin: 0 0 12px; }
.block + .block { margin-top: 26px; }
.typebar { display: flex; gap: 3px; height: 10px; max-width: 640px; }
.typebar i { display: block; height: 100%; border-radius: 5px; min-width: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 12px; font-size: 14.5px; color: var(--muted); }
.legend b { color: var(--text); font-weight: 560; margin-left: 6px; }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 7px; }

/* breakdown */
table { width: 100%; border-collapse: collapse; }
th { text-align: left; color: var(--muted); font-weight: 500; font-size: 14px; padding: 12px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 15px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th:first-child, td:first-child { padding-left: 0; width: 28px; }
th:last-child, td:last-child { padding-right: 0; }
.r { text-align: right; }
td.v { font-size: 16px; font-weight: 600; }
.nm { display: inline-flex; flex-direction: column; gap: 7px; max-width: 100%; }
.nm .n { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 500; min-width: 0; }
.nm .n span.l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nm .track { width: min(100%, 320px); height: 2px; }
.nm .sbar { display: block; height: 2px; border-radius: 1px; min-width: 6px; }
button.nm { text-align: left; }
button.nm:hover .l { text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 4px; }

/* machines */
.machines { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.mcard .t { display: flex; align-items: center; gap: 9px; font-weight: 600; }
.mcard .meta { color: var(--muted); font-size: 13.5px; margin-top: 8px; display: grid; gap: 2px; }
.st { font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 99px; margin-left: auto; }
.st.on { color: var(--ok); background: rgba(74,222,128,.1); }
.st.off { color: var(--muted); background: var(--pill); }

/* dialog */
dialog { background: #050505; color: var(--text); border: 1px solid var(--line2); border-radius: 18px; padding: 26px 30px 28px; width: min(980px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); box-shadow: 0 24px 80px rgba(0,0,0,.9); }
dialog::backdrop { background: rgba(0,0,0,.72); backdrop-filter: blur(3px); }
dialog h3 { margin: 0; font-size: 24px; display: flex; align-items: center; gap: 10px; padding-right: 44px; word-break: break-all; }
dialog .x { position: absolute; right: 18px; top: 18px; }
.dstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin: 26px 0 30px; }
.dstats .v { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
.dtypes { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }

/* subscriptions list (limits + machine split) */
.led { margin-top: 26px; border-top: 1px solid var(--line); }
.led.one { margin-top: 22px; border-top: 0; }
.lrow { padding: 14px 0 16px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
.led.one .lrow { padding-top: 0; border-bottom: 0; }
.lrow .top { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
.lrow .top .who { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; min-width: 0; }
.lrow .top .who .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .top button.who:hover .l { text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 4px; }
.lrow .top .val { margin-left: auto; font-size: 17px; font-weight: 650; white-space: nowrap; }
.lrow .det { color: var(--muted); font-size: 13px; margin-top: -8px; }
.lim { display: grid; gap: 0; }
.lbar { position: relative; height: 34px; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 10px; width: 100%; text-align: left;
  background: repeating-linear-gradient(135deg, #1b1b1b 0 2px, #0c0c0c 2px 7px); border: 1px solid var(--line2); }
.lbar .lfill { position: absolute; inset: 0 auto 0 0; background: var(--lf, #3a3a3a); border-radius: 7px 0 0 7px; }
.lbar.claude { --lf: #4b2a20; } .lbar.codex { --lf: #333; }
.lim.warn .lbar { --lf: #5a4313; } .lim.bad .lbar { --lf: #5c1f1f; }
.lbar .lpace { position: absolute; top: 5px; bottom: 5px; width: 2px; margin-left: -1px; background: var(--text); border-radius: 1px; box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
.lbar .ltxt, .lbar .lreset { position: relative; font-size: 13px; white-space: nowrap; }
.lbar .ltxt b { font-weight: 600; margin-right: 4px; }
.lbar .lreset { color: var(--text); background: rgba(0,0,0,.55); padding: 2px 7px; border-radius: 6px; font-size: 12px; }
.lbar:hover { border-color: #3a3a3a; }
.lsub { padding: 8px 2px 4px; display: grid; gap: 6px; }
.lm { display: grid; grid-template-columns: minmax(0, 1fr) 90px 48px 64px; gap: 10px; align-items: center; font-size: 13px; }
.lm .who { display: inline-flex; align-items: center; gap: 7px; min-width: 0; } .lm .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lm .lmbar { height: 6px; background: var(--line2); border-radius: 3px; overflow: hidden; } .lm .lmbar i { display: block; height: 100%; border-radius: 3px; }
.lm b, .lm .muted { text-align: right; }
.lanenote { font-size: 12.5px; color: var(--faint); margin: 10px 0 0; line-height: 1.6; }
.lanenote svg { vertical-align: -1px; margin: 0 6px 0 0; }
.meter .k, .msplit .k { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.meter .k b { color: var(--text); font-weight: 600; }
.meter .mtrack { height: 8px; border-radius: 4px; background: var(--line2); margin-top: 6px; overflow: hidden; }
.meter .mtrack i { display: block; height: 100%; border-radius: 4px; background: var(--text); }
.meter.hot .mtrack i { background: var(--warn); } .meter.hot .k b { color: var(--warn); }
.msplit .k span:first-child { overflow: hidden; text-overflow: ellipsis; }
.msplit .sb { display: flex; gap: 2px; height: 8px; margin-top: 6px; }
.msplit .sb button { height: 100%; border-radius: 4px; min-width: 4px; background: var(--mc); transition: opacity .15s; }
.msplit .sb:hover button:not(:hover) { opacity: .45; }

/* chart head, legend, options */
.chartHead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.chartHead .chartTitle { margin: 0; margin-right: auto; }
.charts { align-content: start; }
.cleg { align-items: flex-start; display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 8px; }
.cleg button { display: inline-flex; align-items: center; gap: 7px; padding: 3px 9px; border-radius: 99px; font-size: 13px; color: var(--muted); transition: opacity .15s; }
.cleg button:hover { background: var(--pill); color: var(--text); }
.cleg button[aria-pressed="false"] { opacity: .4; text-decoration: line-through; text-decoration-color: var(--faint); }
.cleg .static { display: inline-flex; align-items: center; gap: 7px; padding: 3px 9px; font-size: 13px; color: var(--faint); }
.cpop { width: 300px; }
.cpop h4 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.cpop .opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 8px; }
.cpop .seg button { padding: 3px 9px; font-size: 12.5px; }
.cpop .srow3 { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; padding: 6px 0; border-top: 1px solid var(--line2); }
.cpop .srow3 .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cpop .dashes { display: inline-flex; gap: 2px; }
.cpop .dashes button { width: 30px; height: 22px; border-radius: 6px; display: grid; place-items: center; }
.cpop .dashes button[aria-pressed="true"] { background: var(--pill); }
.cpop input[type=color] { width: 22px; height: 22px; border: 0; border-radius: 50%; padding: 0; background: none; cursor: pointer; }
.cpop input[type=color]::-webkit-color-swatch-wrapper { padding: 0; } .cpop input[type=color]::-webkit-color-swatch { border: 1px solid var(--line2); border-radius: 50%; }

/* breakdown */
.bdtools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chips2 { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border-radius: 99px; border: 1px solid var(--line2); font-size: 13px; transition: opacity .15s, border-color .15s; }
.chip b { color: var(--muted); font-weight: 560; }
.chip:hover { border-color: #3a3a3a; }
.chip[aria-pressed="true"] { border-color: #5a5a5a; background: #111; }
.chips2.focus .chip[aria-pressed="false"]:not(.ghost) { opacity: .4; }
.chip.ghost { color: var(--muted); border-style: dashed; }
tr.click { cursor: pointer; }
tr.click:hover td, tr.click:focus-visible td { background: #0b0b0b; }
tr.click:focus-visible { outline: none; }
tr.click:focus-visible td:first-child { box-shadow: inset 2px 0 0 #3b82f6; }
td.chev { width: 22px; color: var(--faint); padding-left: 4px; }
tr.click:hover td.chev, tr.click:focus-visible td.chev { color: var(--text); }
td.chev svg { width: 15px; height: 15px; display: block; }
.nm .track { display: flex; gap: 2px; }
.nm .track i { display: block; height: 2px; border-radius: 1px; min-width: 2px; }
.nm .sub2 { color: var(--muted); font-size: 13px; font-weight: 400; white-space: nowrap; }
tr.grp td { font-weight: 600; }
tr.nest td { padding-top: 8px; padding-bottom: 8px; color: var(--muted); font-size: 14px; border-bottom: 0; }
tr.nest td:nth-child(2) { padding-left: 24px; }
tr.nest.last td { border-bottom: 1px solid var(--line); padding-bottom: 14px; }
tr.nest td.v { font-size: 14.5px; color: var(--text); }

/* model modal: machine list */
.dchart { margin: 4px 0 18px; }
.dhint { font-size: 12.5px; color: var(--faint); margin: 0 0 6px; }
.dm { display: grid; }
.dm button { display: grid; grid-template-columns: minmax(0, 1fr) 90px 64px 74px; gap: 4px 12px; align-items: center; padding: 9px 8px; border-top: 1px solid var(--line); border-radius: 8px; text-align: left; transition: opacity .15s, background .15s; font-size: 14px; }
.dm button:hover { background: #0c0c0c; }
.dm button { user-select: none; -webkit-user-select: none; }
.dm button .who { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.dm button .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dm button .dbar { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--mc); }
.dm button[aria-pressed="true"] { background: #101010; box-shadow: inset 2px 0 0 var(--mc); }
.dm button.ex { opacity: .32; }
.dm button.ex .who span { text-decoration: line-through; text-decoration-color: var(--faint); }
.dm.hi button[aria-pressed="false"]:not(.ex) { opacity: .55; }

footer { margin-top: 48px; color: var(--faint); font-size: 13px; line-height: 1.6; }
footer b { color: var(--muted); font-weight: 500; }
.err { color: var(--bad); margin-top: 16px; }

/* header wraps before the filters and the period switch collide */
@media (max-width: 1300px) {
  .bar { flex-wrap: wrap; }
  .crumbs { flex-basis: 100%; }
}
/* tablet */
@media (max-width: 1000px) {
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .top { grid-template-columns: 1fr; gap: 32px; }
}
/* phone */
@media (max-width: 640px) {
  .bar { padding: 10px var(--pad) 10px; gap: 10px; }
  main { padding-left: var(--pad); padding-right: var(--pad); }
  .crumbs { overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--pad)); padding: 0 var(--pad); flex-basis: calc(100% + 2 * var(--pad)); }
  .crumbs::-webkit-scrollbar { display: none; }
  .tools { width: 100%; }
  #range { flex: 1; overflow-x: auto; scrollbar-width: none; }
  #range button { flex: 1; padding: 6px 7px; }
  .dm button { grid-template-columns: minmax(0, 1fr) 76px 56px; }
  .dm button .tk { display: none; }
  #metric button { padding: 6px 9px; }
  #liveBtn span, #refresh { display: none; }
  #liveBtn { padding: 0; width: 34px; justify-content: center; }
  .menu { position: fixed; left: var(--pad); right: var(--pad); top: auto; min-width: 0; margin-top: 6px; }
  .hero { font-size: 46px; }
  section { margin-top: 34px; }
  .top { margin-top: 20px; }
  .chart svg { height: 210px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .stat .v { font-size: 21px; }
  .hide-s { display: none; }
  td { padding: 13px 6px; }
  td.v, .nm .n { font-size: 15px; }
  .mval span { display: none; }
  .sess { margin-left: 10px; }
  .srow2 { grid-template-columns: minmax(0, 1fr) auto; }
  .srow2 .t { grid-column: 1; grid-row: 2; font-size: 12.5px; }
  .srow2 .r { grid-row: 1 / 3; grid-column: 2; }
  dialog { padding: 22px 18px 24px; border-radius: 16px; }
  dialog h3 { font-size: 19px; }
  .dstats { grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 20px 0 24px; }
  .dstats .v { font-size: 24px; }
  .dtypes { grid-template-columns: 1fr; gap: 22px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

<script>

  codex: '<span class="glyph" style="color:var(--codex)" role="img" aria-label="Codex"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.282 9.821a6 6 0 0 0-.516-4.91a6.05 6.05 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a6 6 0 0 0-3.998 2.9a6.05 6.05 0 0 0 .743 7.097a5.98 5.98 0 0 0 .51 4.911a6.05 6.05 0 0 0 6.515 2.9A6 6 0 0 0 13.26 24a6.06 6.06 0 0 0 5.772-4.206a6 6 0 0 0 3.997-2.9a6.06 6.06 0 0 0-.747-7.073M13.26 22.43a4.48 4.48 0 0 1-2.876-1.04l.141-.081l4.779-2.758a.8.8 0 0 0 .392-.681v-6.737l2.02 1.168a.07.07 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494M3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085l4.783 2.759a.77.77 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646M2.34 7.896a4.5 4.5 0 0 1 2.366-1.973V11.6a.77.77 0 0 0 .388.677l5.815 3.354l-2.02 1.168a.08.08 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.855l-5.833-3.387L15.119 7.2a.08.08 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.407-.667m2.01-3.023l-.141-.085l-4.774-2.782a.78.78 0 0 0-.785 0L9.409 9.23V6.897a.07.07 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zm-12.64 4.135l-2.02-1.164a.08.08 0 0 1-.038-.057V6.075a4.5 4.5 0 0 1 7.375-3.453l-.142.08L8.704 5.46a.8.8 0 0 0-.393.681zm1.097-2.365l2.602-1.5l2.607 1.5v2.999l-2.597 1.5l-2.607-1.5Z"/></svg></span>',
};
const glyph = (p) => GLYPH[p] || '<span class="glyph faint">•</span>';
const PROV = (p) => p === 'claude' ? 'Claude Code' : p === 'codex' ? 'Codex' : p;
const ls = { get(k, d) { try { const v = localStorage.getItem('ps:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('ps:' + k, JSON.stringify(v)); } catch {} } };
const CHART0 = { res: 'hour', mode: 'comb', type: 'lines', lanes: true, fill: true, curve: 'smooth', styles: {}, hidden: [] };
const S = { range: ls.get('range', '24h'), metric: ls.get('metric', 'cost'), bd: ['time', 'machine'].includes(ls.get('bd', 'model')) ? ls.get('bd') : 'model', merge: ls.get('merge', 'split') === 'merge' ? 'merge' : 'split', chart: { ...CHART0, ...ls.get('chart', {}) }, subs: ls.get('subs', []), machines: ls.get('machines', []), providers: ls.get('providers', []), live: ls.get('live', true) };
let data = null, es = null;

const fmtN = (n) => n >= 1e9 ? (n / 1e9).toFixed(2) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(n >= 1e8 ? 0 : n >= 1e7 ? 1 : 2) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, '') + 'K' : String(Math.round(n));
const fmtC = (n) => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const val = (t) => S.metric === 'cost' ? t.cost : t.tokens;
const fmtV = (n) => S.metric === 'cost' ? fmtC(n) : fmtN(n);
const dur = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`; };
const ago = (ms) => ms < 60e3 ? 'just now' : ms < 3600e3 ? Math.round(ms / 60e3) + 'm ago' : ms < 864e5 ? Math.round(ms / 3600e3) + 'h ago' : Math.round(ms / 864e5) + 'd ago';
// colour: this device's override > shared choice (set from a machine running plainsight) > palette
const LOCAL = ['127.0.0.1', 'localhost', '[::1]'].includes(location.hostname);
let myColors = ls.get('colors', {});
const mcol = (nick) => {
  if (myColors[nick]) return myColors[nick];
  if ((data.options.colors || {})[nick]) return data.options.colors[nick];
  const i = (data.options.machineOrder || data.options.machines).indexOf(nick);
  return i < 0 ? '#8e8e8e' : MPAL[i % MPAL.length];
};
const mdot = (nick) => `<span class="dot" style="background:${mcol(nick)}"></span>`;
const subInfo = (sub) => data.options.subscriptions.find((s) => s.sub === sub) || { label: sub.slice(0, 6), provider: '' };

function seg(id, key, onChange) {
  const el = $(id);
  const paint = () => el.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === S[key])));
  el.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; S[key] = b.dataset.v; ls.set(key, S[key]); paint(); onChange(); });
  paint();
}

function dropdown(id, key, items, allLabel, noun) {
  const dd = $(id), btn = dd.querySelector('button'), menu = dd.querySelector('.menu');
  const sel = new Set(S[key].filter((v) => items.some((i) => i.v === v)));
  btn.textContent = !sel.size ? allLabel : sel.size === 1 ? items.find((i) => sel.has(i.v)).label : `${sel.size} ${noun}`;
  menu.innerHTML = `<label><input type="checkbox" data-all ${sel.size ? '' : 'checked'}> ${esc(allLabel)}</label><hr>` +
    items.map((i) => `<label><input type="checkbox" value="${esc(i.v)}" ${sel.has(i.v) ? 'checked' : ''}> ${i.html || esc(i.label)}${i.note ? `<span class="note">${esc(i.note)}</span>` : ''}</label>`).join('');
  menu.onchange = (e) => {
    if (e.target.dataset.all !== undefined) S[key] = [];
    else S[key] = [...menu.querySelectorAll('input[value]:checked')].map((x) => x.value);

  };

function closeMenus() { document.querySelectorAll('.dd').forEach((d) => { d.classList.remove('open'); d.querySelector('button').setAttribute('aria-expanded', 'false'); }); }
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.dd > button');
  if (btn) { const dd = btn.parentElement, open = !dd.classList.contains('open'); closeMenus(); dd.classList.toggle('open', open); btn.setAttribute('aria-expanded', String(open)); if (open && matchMedia('(max-width:640px)').matches) dd.querySelector('.menu').style.top = btn.getBoundingClientRect().bottom + 'px'; return; }

});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenus(); });

async function load() {
  const p = new URLSearchParams({ range: S.range, tz: String(new Date().getTimezoneOffset()), res: S.chart.res });
  if (S.subs.length) p.set('subs', S.subs.join(','));
  if (S.machines.length) p.set('machines', S.machines.join(','));
  if (S.providers.length) p.set('providers', S.providers.join(','));
  try {
    const r = await fetch('/api/summary?' + p, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    data = await r.json();
    $('err').textContent = '';
    render();
  } catch (e) { $('err').textContent = 'Could not load data: ' + e.message; }
}

function render() {
  const o = data.options;
  dropdown('dd-subs', 'subs', o.subscriptions.map((s) => ({ v: s.sub, label: s.label, html: `${glyph(s.provider)}${esc(s.label)}`, note: PROV(s.provider) })), 'All subscriptions', 'subscriptions');
  const online = new Set(data.machines.filter((m) => m.online).map((m) => m.nick));
  dropdown('dd-machines', 'machines', (o.machineOrder || o.machines).map((m) => ({ v: m, label: m, html: `${mdot(m)}${esc(m)}`, note: online.has(m) ? 'online' : '' })), 'All machines', 'machines');
  dropdown('dd-providers', 'providers', o.providers.map((p) => ({ v: p, label: PROV(p), html: `${glyph(p)}${esc(PROV(p))}` })), 'All providers', 'providers');
  // limit ranges need exactly one subscription in view that reports limits; the server falls back otherwise
  const limOk = Object.keys(data.limits || {}).length === 1 && data.subscriptions.length <= 1;
  $('range').querySelectorAll('button').forEach((b) => {
    if (b.dataset.v === 'win' || b.dataset.v === 'week') { b.disabled = !limOk && data.range !== b.dataset.v; b.title = b.disabled ? 'Needs one subscription in view with limit data' : b.dataset.v === 'win' ? 'Since the current 5-hour window started' : 'Since the weekly limit last reset'; }

  });

// ---- charts: one chart with a line per subscription, or one chart per subscription with a line per machine
function monotone(pts) {
  const n = pts.length;

  const dx = [], m = [], tg = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = pts[i + 1][0] - pts[i][0]; m[i] = (pts[i + 1][1] - pts[i][1]) / (dx[i] || 1); }

  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < n - 1; i++) {
    const h = dx[i] / 3;
    d += `C${pts[i][0] + h},${pts[i][1] + tg[i] * h} ${pts[i + 1][0] - h},${pts[i + 1][1] - tg[i + 1] * h} ${pts[i + 1][0]},${pts[i + 1][1]}`;
  }

}

}

// spec: { lines: [{ html, c, dash, w, o, fill, dim, vals }], lanes: [laneOf()], total, label }
const LANE_NOTE = '<p class="lanenote"><svg width="26" height="10" aria-hidden="true"><rect width="26" height="10" rx="3" fill="#8e8e8e" fill-opacity=".2"/><rect width="11" height="10" rx="3" fill="#8e8e8e" fill-opacity=".75"/></svg>Strip above the chart: each 5-hour limit window, filled to how much of the limit it used. <svg width="8" height="12" aria-hidden="true"><line x1="4" x2="4" y1="0" y2="12" stroke="#8e8e8e" stroke-dasharray="3 3"/></svg>Dashed line: weekly limit reset. Hover the chart for details.</p>';

      </div>
      ${sess.length ? `<div class="sess">${sess.map((x) => `<div class="srow2${now - x.last < 3 * 60e3 ? '' : ' idle'}">
        <span class="m">${glyph(x.provider)}${esc(pretty(x.model))}${subs.length > 1 || data.options.subscriptions.length > 1 ? ` <span class="faint">· ${esc(x.label)}</span>` : ''}</span>
        <span class="t">running <b class="num" data-since="${x.streak}">${dur(now - x.streak)}</b> · last <span data-ago="${x.last}">${ago(now - x.last)}</span></span>
        <span class="r num">${fmtN(x.totals.tokens)} · <b>${fmtC(x.totals.cost)}</b></span></div>`).join('')}</div>` : ''}
    </div>`;
  }).join('') || '<div class="empty">No machines yet.</div>';
}

// colour popover
let popFor = null;
function openPop(btn, nick) {
  const pop = $('pop'), cur = mcol(nick);
  popFor = nick;
  pop.innerHTML = `<div class="g">${MPAL.map((c) => `<button style="--c:${c}" data-c="${c}" aria-label="${c}" aria-pressed="${c === cur}"></button>`).join('')}</div>
    <div class="row"><label style="display:flex;align-items:center;gap:8px">Custom <input type="color" value="${cur}"></label><button class="reset">Reset</button></div>
    <div class="note">${LOCAL ? 'Changes apply on every machine and phone.' : 'Saved on this device. To change it everywhere, pick it on a machine running plainsight.'}</div>`;
  pop.classList.add('open');
  const r = btn.getBoundingClientRect();
  pop.style.left = Math.max(12, Math.min(innerWidth - pop.offsetWidth - 12, r.left - 8)) + 'px';
  const below = r.bottom + 8;
  pop.style.top = (below + pop.offsetHeight > innerHeight - 12 ? Math.max(12, r.top - pop.offsetHeight - 8) : below) + 'px';
}
function closePop() { $('pop').classList.remove('open'); popFor = null; }
async function setColor(nick, c) {
  if (LOCAL && c) {
    try {
      const r = await fetch('/api/color', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ machine: nick, color: c }) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      delete myColors[nick];
    } catch (e) { myColors[nick] = c; $('err').textContent = 'Saved on this device only: ' + e.message; }
  } else if (c) myColors[nick] = c;
  else delete myColors[nick];
  ls.set('colors', myColors);
  if (LOCAL && c) await load(); else render();
}
$('machines').addEventListener('click', (e) => { const b = e.target.closest('[data-color]'); if (b) { e.stopPropagation(); popFor === b.dataset.color ? closePop() : openPop(b, b.dataset.color); } });
$('pop').addEventListener('click', (e) => {
  e.stopPropagation();
  const b = e.target.closest('[data-c]');
  if (b) { const n = popFor; closePop(); setColor(n, b.dataset.c); }
  if (e.target.closest('.reset')) { const n = popFor; closePop(); setColor(n, null); }
});
$('pop').addEventListener('change', (e) => { if (e.target.type === 'color') { const n = popFor; closePop(); setColor(n, e.target.value.toLowerCase()); } });
document.addEventListener('click', (e) => { if (popFor && !e.target.closest('#pop')) closePop(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePop(); });
addEventListener('scroll', () => popFor && closePop(), { passive: true });

function setLive(on) {
  S.live = on; ls.set('live', on);
  $('liveBtn').setAttribute('aria-pressed', String(on));
  if (es) { es.close(); es = null; }
  if (on) {
    let pending = null;
    es = new EventSource('/api/live');
    es.addEventListener('change', () => { if (!pending) pending = setTimeout(() => { pending = null; load(); }, 800); });
  }
}

seg('range', 'range', load);
seg('metric', 'metric', () => data && render());
seg('bd', 'bd', () => data && renderBreakdown());
seg('merge', 'merge', () => data && renderBreakdown());
$('liveBtn').onclick = () => setLive(!S.live);
$('refresh').onclick = load;
setLive(S.live);
load();
setInterval(() => {
  const now = Date.now();
  document.querySelectorAll('[data-since]').forEach((el) => { el.textContent = dur(now - Number(el.dataset.since)); });
  document.querySelectorAll('[data-ago]').forEach((el) => { el.textContent = ago(now - Number(el.dataset.ago)); });
}, 1000);
setInterval(() => { if (!S.live) load(); }, 60e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
let rz = null;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (data) { renderCharts(); renderModal(); } }, 120); });
</script>
</body>
